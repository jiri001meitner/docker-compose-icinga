x-icinga-db-web-config: &icinga-db-web-config
  icingaweb.modules.icingadb.config.icingadb.resource: icingadb
  icingaweb.modules.icingadb.redis.redis1.host: icingadb-redis
  icingaweb.modules.icingadb.redis.redis1.port: 6379
  icingaweb.modules.icingadb.commandtransports.icinga2.host: icinga2
  icingaweb.modules.icingadb.commandtransports.icinga2.port: 5665
  icingaweb.modules.icingadb.commandtransports.icinga2.password: ${ICINGAWEB_ICINGA2_API_USER_PASSWORD:?ICINGAWEB_ICINGA2_API_USER_PASSWORD must be set in .env}
  icingaweb.modules.icingadb.commandtransports.icinga2.transport: api
  icingaweb.modules.icingadb.commandtransports.icinga2.username: icingaweb
  icingaweb.resources.icingadb.charset: utf8mb4
  icingaweb.resources.icingadb.db: mysql
  icingaweb.resources.icingadb.dbname: icingadb
  icingaweb.resources.icingadb.host: mysql
  icingaweb.resources.icingadb.password: ${ICINGADB_MYSQL_PASSWORD:?ICINGADB_MYSQL_PASSWORD must be set in .env}
  icingaweb.resources.icingadb.type: db
  icingaweb.resources.icingadb.username: icingadb

x-icinga-web-config: &icinga-web-config
  icingaweb.authentication.icingaweb2.backend: db
  icingaweb.authentication.icingaweb2.resource: icingaweb-mysql
  icingaweb.config.global.config_backend: db
  icingaweb.config.global.config_resource: icingaweb-mysql
  icingaweb.config.global.module_path: /usr/share/icingaweb2/modules
  icingaweb.config.logging.log: php
  icingaweb.groups.icingaweb2.backend: db
  icingaweb.groups.icingaweb2.resource: icingaweb-mysql
  icingaweb.passwords.icingaweb2.icingaadmin: ${ICINGAWEB_ADMIN_PASSWORD:?ICINGAWEB_ADMIN_PASSWORD must be set in .env}
  icingaweb.resources.icingaweb-mysql.charset: utf8mb4
  icingaweb.resources.icingaweb-mysql.db: mysql
  icingaweb.resources.icingaweb-mysql.dbname: icingaweb
  icingaweb.resources.icingaweb-mysql.host: mysql
  icingaweb.resources.icingaweb-mysql.password: ${ICINGAWEB_MYSQL_PASSWORD:?ICINGAWEB_MYSQL_PASSWORD must be set in .env}
  icingaweb.resources.icingaweb-mysql.type: db
  icingaweb.resources.icingaweb-mysql.username: icingaweb
  icingaweb.roles.Administrators.groups: Administrators
  icingaweb.roles.Administrators.permissions: '*'
  icingaweb.roles.Administrators.users: icingaadmin

x-icinga2-environment: &icinga2-environment
  ICINGA_CN: icinga2
  ICINGA_MASTER: 1

x-logging: &default-logging
  driver: "json-file"
  options:
    max-file: "10"
    max-size: "1M"

networks:
  net:
    driver: bridge
    # Dual-stack. IPv6 is a ULA following fd00:d0c:<third IPv4 octet>::/64;
    # outbound traffic is masqueraded by the firewall.
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: br-icinga
    ipam:
      driver: default
      config:
        - subnet: "${V4_PREFIX:-172.29.0}.0/24"
          gateway: "${V4_PREFIX:-172.29.0}.1"
        - subnet: "${V6_PREFIX:-fd00:d0c:29}::/64"
          gateway: "${V6_PREFIX:-fd00:d0c:29}::1"

volumes:
  icinga2:
  icingaweb:
  mysql:

services:
  mysql:
    hostname: mariadb.icinga
    image: mariadb:11.8
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      ICINGADB_MYSQL_PASSWORD: ${ICINGADB_MYSQL_PASSWORD:?ICINGADB_MYSQL_PASSWORD must be set in .env}
      ICINGAWEB_MYSQL_PASSWORD: ${ICINGAWEB_MYSQL_PASSWORD:?ICINGAWEB_MYSQL_PASSWORD must be set in .env}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MYSQL_ROOT_PASSWORD --protocol=tcp || exit 1"]
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 90s
    volumes:
      - mysql:/var/lib/mysql
      - ./env/mysql/:/docker-entrypoint-initdb.d/
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.10"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::10"

  icingadb-redis:
    hostname: redis.icinga
    image: redis:alpine
#    image: docker.dragonflydb.io/dragonflydb/dragonfly
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:  { condition: service_healthy }
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.11"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::11"

  icingadb:
    hostname: db.icinga
    image: icinga/icingadb
    environment:
      ICINGADB_DATABASE_HOST: mysql
      ICINGADB_DATABASE_PORT: 3306
      ICINGADB_DATABASE_DATABASE: icingadb
      ICINGADB_DATABASE_USER: icingadb
      ICINGADB_DATABASE_PASSWORD: ${ICINGADB_MYSQL_PASSWORD:?ICINGADB_MYSQL_PASSWORD must be set in .env}
      ICINGADB_REDIS_HOST: icingadb-redis
      ICINGADB_REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "icingadb", "--version"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:          { condition: service_healthy }
      icingadb-redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.12"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::12"

  # Jednorázový init kontejner – NESMÍ se restartovat do smyčky
  init-icinga2:
    hostname: icingainit.icinga
    image: icinga/icinga2
    command: [ "/config/init-icinga2.sh" ]
    environment:
      <<: *icinga2-environment
      ICINGAWEB_ICINGA2_API_USER_PASSWORD: ${ICINGAWEB_ICINGA2_API_USER_PASSWORD:?ICINGAWEB_ICINGA2_API_USER_PASSWORD must be set in .env}
    restart: "no"
    logging: *default-logging
    volumes:
      - icinga2:/data
      - ./icingadb.conf:/config/icingadb.conf
      - ./icingaweb-api-user.conf:/config/icingaweb-api-user.conf
      - ./init-icinga2.sh:/config/init-icinga2.sh
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.13"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::13"

  icingaweb:
    hostname: web.icinga
    image: icinga/icingaweb2
    environment:
      icingaweb.enabledModules: icingadb, incubator
      <<: [*icinga-db-web-config, *icinga-web-config]
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      icingadb:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pgrep apache2|grep . -q
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - icingaweb:/data
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.14"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::14"

  icingaweb-socket:
    image: alpine/socat
    restart: unless-stopped
    user: "${SOCKET_UID:?SOCKET_UID must be set in .env}:${SOCKET_GID:?SOCKET_GID must be set in .env}"
    network_mode: "service:icingaweb"
    depends_on:
      icingaweb:
        condition: service_healthy
        restart: true
    volumes:
      - ${SOCKET_DIR:-/run/icinga}:/run/icinga
    command: >-
      -d -d
      UNIX-LISTEN:/run/icinga/web.sock,fork,reuseaddr,unlink-early,mode=0660
      TCP:127.0.0.1:8080
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/icinga/web.sock || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  icinga2:
    hostname: api.icinga
    image: icinga/icinga2
    command: [ "sh", "-c", "sleep 5; icinga2 daemon" ]
    entrypoint: []
    # Neprivilegovaný ICMP pro uživatele icinga (GID 5665): check_ping
    # (hostalive, ping4/ping6) jinak bez CAP_NET_RAW selže.
    sysctls:
      net.ipv4.ping_group_range: "5665 5665"
    environment: *icinga2-environment
    depends_on:
      init-icinga2:
        condition: service_completed_successfully
      icingadb-redis:
        condition: service_healthy
        restart: true
      icingaweb:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >
          ps aux | grep '/icinga2' | grep -wq daemon
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    volumes:
      - icinga2:/data
      - ./icinga2.conf.d:/custom_data/custom.conf.d
    networks:
      net:
        ipv4_address: "${V4_PREFIX:-172.29.0}.15"
        ipv6_address: "${V6_PREFIX:-fd00:d0c:29}::15"

  icinga2-socket:
    image: alpine/socat
    restart: unless-stopped
    user: "${SOCKET_UID:?SOCKET_UID must be set in .env}:${SOCKET_GID:?SOCKET_GID must be set in .env}"
    network_mode: "service:icinga2"
    depends_on:
      icinga2:
        condition: service_healthy
        restart: true
    volumes:
      - ${SOCKET_DIR:-/run/icinga}:/run/icinga
    command: >-
      -d -d
      UNIX-LISTEN:/run/icinga/api.sock,fork,reuseaddr,unlink-early,mode=0660
      TCP:127.0.0.1:5665
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/icinga/api.sock || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

