#!/usr/sbin/nft -f
# icinga  |  bridge br-icinga  |  172.29.0.0/24 + fd00:d0c:29::/64
#
# Novy soubor: drive icinga_net nemel zadna pravidla a ven se nedostal
# vubec. Ted ma vystup na internet (masquerade) + standardni izolaci od
# ostatnich docker bridge. Zadny port se nepublikuje pres nftables -
# icingaweb i icinga2 API se obsluhuji socat unix socketem (/run/icinga).
#
# Rodina `inet` (dual-stack). Navazuje na 2_docker.conf.

define icg_b  = "br-icinga"
define icg_n4 = 172.29.0.0/24
define icg_n6 = fd00:d0c:29::/64

table inet docker_nat {
	chain DOCKER {
		iifname $icg_b counter return
	}

	chain POSTROUTING {
		ip  saddr $icg_n4 oifname != $icg_b counter masquerade
		ip6 saddr $icg_n6 oifname != $icg_b counter masquerade
	}
}

table inet docker_filter {
	chain DOCKER {
		iifname != $icg_b oifname $icg_b counter drop
	}

	chain DOCKER-FORWARD {
		iifname $icg_b counter accept
	}

	chain DOCKER-BRIDGE {
		oifname $icg_b counter jump DOCKER
	}

	chain DOCKER-CT {
		oifname $icg_b ct state related,established counter accept
	}

	chain DOCKER-ISOLATION-STAGE-1 {
		iifname $icg_b oifname != $icg_b counter jump DOCKER-ISOLATION-STAGE-2
	}

	chain DOCKER-ISOLATION-STAGE-2 {
		oifname $icg_b counter drop
	}
}

table inet docker_raw {
	chain PREROUTING {
		ip  daddr $icg_n4 ct state established,related counter accept
		ip  daddr $icg_n4 iifname != $icg_b counter drop
		ip6 daddr $icg_n6 ct state established,related counter accept
		ip6 daddr $icg_n6 iifname != $icg_b counter drop
	}
}
