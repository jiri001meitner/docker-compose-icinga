#!/usr/sbin/nft -f
# MASTER pravidla pro Docker (daemon iptables=false / ip6tables=false).
#
# Rodina jen `inet` -> jedno pravidlo = IPv4 i IPv6. Tri dedikovane
# tabulky s vlastnimi hooky (drive to byly table ip|ip6 nat|filter|raw).
# Nacita se az po /etc/nftables.conf. Per-app 3_docker_*.conf jen znovu
# deklaruji stejne pojmenovane retezce a pravidla se PRIPOJI (merge).
#
# IPv6 ULA plan: fd00:d0c:<treti-oktet-v4>::/64
# Vyzaduje v /etc/docker/daemon.json:
#   "ipv6": true, "fixed-cidr-v6": "fd00:d0c:17::/64"

define docker0_net4 = 172.17.0.0/16
define docker0_net6 = fd00:d0c:17::/64

table inet docker_nat {
	chain PREROUTING {
		type nat hook prerouting priority dstnat; policy accept;
		fib daddr type local counter jump DOCKER
	}

	chain OUTPUT {
		type nat hook output priority dstnat; policy accept;
		ip  daddr != 127.0.0.0/8 fib daddr type local counter jump DOCKER
		ip6 daddr != ::1         fib daddr type local counter jump DOCKER
	}

	chain POSTROUTING {
		type nat hook postrouting priority srcnat; policy accept;
		ip  saddr $docker0_net4 oifname != "docker0" counter masquerade
		ip6 saddr $docker0_net6 oifname != "docker0" counter masquerade
	}

	chain DOCKER {
		iifname "docker0" counter return
	}
}
table inet docker_filter {
	chain FORWARD {
		type filter hook forward priority filter; policy accept;
		counter jump DOCKER-USER
		counter jump DOCKER-FORWARD
	}

	chain DOCKER-USER {
	}

	chain DOCKER-FORWARD {
		counter jump DOCKER-CT
		counter jump DOCKER-ISOLATION-STAGE-1
		counter jump DOCKER-BRIDGE
		iifname "docker0" counter accept
	}

	chain DOCKER {
		iifname != "docker0" oifname "docker0" counter drop
	}

	chain DOCKER-BRIDGE {
		oifname "docker0" counter jump DOCKER
	}

	chain DOCKER-CT {
		oifname "docker0" ct state related,established counter accept
	}

	chain DOCKER-ISOLATION-STAGE-1 {
		iifname "docker0" oifname != "docker0" counter jump DOCKER-ISOLATION-STAGE-2
	}

	chain DOCKER-ISOLATION-STAGE-2 {
		oifname "docker0" counter drop
	}
}
table inet docker_raw {
	chain PREROUTING {
		type filter hook prerouting priority raw; policy accept;
	}
}
